  if(kind==='rocket'){m.rotation.order='YXZ';m.rotation.set(Math.PI/2,Math.atan2(dx,dz),0);}
  m.position.set(x,y,z);scene.add(m);
  const sp=kind==='rocket'?48:13;projs.push({kind,m,x,y,z,vx:dx*sp,vy:kind==='rocket'?0:6,vz:dz*sp,t:0,fuse:kind==='rocket'?3:2.2,w,pt:0});}
function projStep(dt){for(let i=projs.length-1;i>=0;i--){const P=projs[i];P.t+=dt;let boom=false;
    const n=P.kind==='rocket'?3:1,h=dt/n;
    for(let q=0;q<n&&!boom;q++){
      if(P.kind==='grenade'){P.vy-=20*h;const nx=P.x+P.vx*h,nz=P.z+P.vz*h;
        if(inCol(nx,P.z)){P.vx*=-.5;}else P.x=nx;if(inCol(P.x,nz)){P.vz*=-.5;}else P.z=nz;
        P.y+=P.vy*h;if(P.y<.12){P.y=.12;P.vy=Math.abs(P.vy)*.35;P.vx*=.7;P.vz*=.7;}P.m.rotation.x+=dt*9;}
      else{P.x+=P.vx*h;P.z+=P.vz*h;
        if(inCol(P.x,P.z))boom=true;
        for(const V of vehicles){if(V===pl.veh||V.stash||V.wreckT>0||!V.g.visible)continue;if(Math.hypot(V.g.position.x-P.x,V.g.position.z-P.z)<2.3){boom=true;break;}}
        if(!boom)for(const o of peds){if(o.g.visible&&o.st!=='fly'&&o.st!=='down'&&Math.hypot(o.g.position.x-P.x,o.g.position.z-P.z)<1.1){boom=true;break;}}
        if(!boom)for(const[id,r]of rem){if(!r.rd&&Math.hypot(r.x-P.x,r.z-P.z)<(r.car?2.4:1.2)){boom=true;break;}}
        if(P.t>P.fuse)boom=true;
        P.pt-=h;if(P.pt<=0){P.pt=.03;puff(P.x-P.vx*.02,P.y,P.z-P.vz*.02,.9,.7);}}}
    P.m.position.set(P.x,P.y,P.z);
    if(P.kind==='grenade'&&P.t>P.fuse)boom=true;
    if(boom){scene.remove(P.m);projs.splice(i,1);explode(P.x,P.z,P.w.r,P.w.bd,false);}}}

  pl.veh=null;pl.mode='walk';setMode('walk');document.body.classList.remove('hv');$('ba').textContent='ENTER';V.kind='parked';V.age=0;
  pl.g.visible=true;pl.g.position.set(p.x+lx*1.3,1.1,p.z+lz*1.3);pl.face=cy=camH=h;
  startFling(lx*spd+V.s.vx*.5,lz*spd+V.s.vz*.5,6.5);

function flingStep(dt){const f=pl.fling,p=pl.g.position;
  if(f.phase==='air'){f.vy-=20*dt;p.x+=f.vx*dt;p.z+=f.vz*dt;p.y+=f.vy*dt;pl.tilt+=f.spin*dt;f.vx*=1-dt*.3;f.vz*=1-dt*.3;
    if(pl.tilt<-Math.PI*1.5)pl.tilt=-Math.PI*1.5;
    if(p.y<=0&&f.vy<0){p.y=0;f.phase='down';f.t=0;pl.tilt=-Math.PI/2;shake=Math.max(shake,.15);puff(p.x,.3,p.z,1.6,.8);}}
  else{f.t+=dt;f.vx*=1-dt*6;f.vz*=1-dt*6;p.x+=f.vx*dt;p.z+=f.vz*dt;
    if(f.t>.9)pl.tilt=-Math.PI/2*Math.max(0,1-(f.t-.9)/.35);
    if(f.t>1.25){pl.fling=null;pl.tilt=0;pl.g.rotation.x=0;swing(pl.g,0,0);return;}}

function stealStep(dt){const S=pl.steal,r=rem.get(S.peer),p=pl.g.position;S.t+=dt;

  if(s.id==='boutique')return OUTFITS.map(([n,a,b])=>['Wear '+n+' · '+money(2.5e5),()=>buyItem(2.5e5,()=>{sv.lk[0]=a;sv.lk[1]=b;look(pl.g,sv.lk);persist();},'Looking sharp')]);
  return[];}
function buyItem(price,fn,msg){if(cash<price){toast('Not enough cash');return;}cash-=price;fn();persist();toast(msg);renderCityShop();}
function buyGun(k){const w=WEAPONS[k];if(cash<w.price){toast('Not enough cash');return;}cash-=w.price;sv.guns.push(k);sv.ammo[k]=(sv.ammo[k]||0)+w.ammoPack;pl.eq=k;weaponHud();persist();toast(w.n+' purchased · Q or GUN to switch');renderCityShop();}
function buyAmmo(k){const w=WEAPONS[k];if(cash<w.packPrice){toast('Not enough cash');return;}cash-=w.packPrice;sv.ammo[k]=(sv.ammo[k]||0)+w.ammoPack;weaponHud();persist();toast('+'+w.ammoPack+' ammo');renderCityShop();}
function renderCityShop(){const s=SHOPS[openShopId];if(!s)return;cityPanel.style.width=s.id==='arms'?'min(94vw,540px)':'';if(s.id==='arms'){renderArms();return;}
  cityPanel.innerHTML='<b>'+s.name+'</b><div style="opacity:.75;margin:4px 0 2px">Cash '+money(cash)+'</div>';
  for(const[t,f,dim]of shopItems(s)){const b=document.createElement('button');b.className='sbtn';b.textContent=t;if(dim||!f)b.style.opacity=.45;else b.addEventListener('click',f);cityPanel.appendChild(b);}
  closeButton(cityPanel);}
function openCityShop(){const s=shopNear();if(!s)return false;openShopId=s.id;cp.style.display=chp.style.display=mpn.style.display=racePanel.style.display='none';renderCityShop();cityPanel.style.display='block';return true;}
function statBar(l,v){return '<div style="display:flex;align-items:center;gap:5px;font-size:10px;margin-top:2px"><span style="width:34px;opacity:.7">'+l+'</span><span style="flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden"><span style="display:block;height:100%;width:'+Math.round(v*100)+'%;background:linear-gradient(90deg,#ffd24a,#ff5a3a)"></span></span></div>';}
function renderArms(){
  cityPanel.innerHTML='<b>LAGOS ARMS · DISPLAY SHELF</b><div style="opacity:.75;margin:4px 0 8px">Cash '+money(cash)+' · tap EQUIP, then Q / the weapon button to cycle</div>';
  const grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px';
  for(const[k,w]of Object.entries(WEAPONS)){const own=sv.guns.includes(k),c=document.createElement('div');
    c.style.cssText='border-radius:12px;padding:8px;background:rgba(0,0,0,.38);border:1px solid '+(pl.eq===k?'#ffd24a':'rgba(255,255,255,.2)');
    c.innerHTML='<div style="height:56px;border-radius:8px;background:linear-gradient(#2a2f3b,#14171e);display:flex;align-items:center;justify-content:center;border-bottom:3px solid #6b4226"><img src="'+weaponIcon(k)+'" style="width:100%;height:50px;object-fit:contain"></div>'+
      '<div style="font-weight:800;margin-top:6px">'+w.n+'</div><div style="font-size:10px;opacity:.65;letter-spacing:.6px">'+w.cat+'</div>'+statBar('DMG',w.st[0])+statBar('RATE',w.st[1])+statBar('RANGE',w.st[2])+
      '<div style="margin-top:6px;font-weight:700;color:'+(own?'#6bff9a':'#ffd24a')+'">'+(own?'OWNED'+(w.kind==='melee'?'':' · ammo '+(sv.ammo[k]||0)):money(w.price))+'</div>';
    const add=(t,f,dim)=>{const b=document.createElement('button');b.className='sbtn';b.style.cssText+=';padding:8px;margin-top:6px;font-size:12px';b.textContent=t;if(dim)b.style.opacity=.45;b.addEventListener('click',f);c.appendChild(b);};
    if(!own)add('BUY',()=>buyGun(k),cash<w.price);
    else{add(pl.eq===k?'EQUIPPED':'EQUIP',()=>{pl.eq=k;weaponHud();renderCityShop();});if(w.kind!=='melee')add('+'+w.ammoPack+' ammo · '+money(w.packPrice),()=>buyAmmo(k),cash<w.packPrice);}
    grid.appendChild(c);}
  cityPanel.appendChild(grid);closeButton(cityPanel);}
// display shelf on the Lagos Arms facade
{const s=SHOPS.arms,zf=s.z-10-.2,keys2=Object.keys(WEAPONS);
  const back=new T.Mesh(new T.PlaneGeometry(24,5.2),new T.MeshStandardMaterial({color:0x1a1411,roughness:.9}));back.position.set(s.x,2.4,zf+.1);back.rotation.y=Math.PI;scene.add(back);
  const rows=[[3.3,keys2.slice(0,5)],[1.3,keys2.slice(5)]];
  for(const[y,list]of rows){const step=22/ (list.length);
    list.forEach((k,i)=>{const w=WEAPONS[k],m=weaponFlat(w,w.kind==='melee'||k==='rpg'?1.6:2.3),x=s.x+11-step*(i+.5);m.position.set(x,y+.15,zf-.05);m.rotation.y=Math.PI;
      m.traverse(o=>{if(o.isMesh)o.castShadow=false;});scene.add(m);});
    const shelf=new T.Mesh(new T.BoxGeometry(23,.12,.6),std({color:0x6b4226,roughness:.7}));shelf.position.set(s.x,y-.35,zf-.25);scene.add(shelf);}
  const spot=new T.PointLight(0xffe2b0,1.1,22);spot.position.set(s.x,4.4,zf-3);scene.add(spot);}</script></body></html>
